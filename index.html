<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时日志监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --warning-color: #ffc107;
            --info-color: #0dcaf0;
            --success-color: #198754;
            --danger-color: #dc3545;
            --dark-color: #212529;
            --light-color: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .control-panel .row {
            margin-bottom: 15px;
        }

        .control-panel .row:last-child {
            margin-bottom: 0;
        }

        .input-group-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-label {
            font-weight: 500;
            color: #495057;
        }

        .log-windows-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .log-window {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .log-window:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .log-window.maximized {
            position: fixed;
            top: 50px;
            left: 50px;
            right: 50px;
            bottom: 50px;
            z-index: 1000;
            transform: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .window-header {
            padding: 15px 20px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .window-header.primary { background: linear-gradient(135deg, var(--primary-color), #0056b3); color: white; }
        .window-header.warning { background: linear-gradient(135deg, var(--warning-color), #e0a800); color: #000; }
        .window-header.info { background: linear-gradient(135deg, var(--info-color), #0aa2c0); color: white; }
        .window-header.success { background: linear-gradient(135deg, var(--success-color), #146c43); color: white; }
        .window-header.danger { background: linear-gradient(135deg, var(--danger-color), #b02a37); color: white; }

        .window-content {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }

        .log-entry {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #dee2e6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .log-entry:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
        }

        .log-timestamp {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .json-content {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-custom {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-primary-custom { background: linear-gradient(135deg, var(--primary-color), #0056b3); }
        .btn-warning-custom { background: linear-gradient(135deg, var(--warning-color), #e0a800); }
        .btn-info-custom { background: linear-gradient(135deg, var(--info-color), #0aa2c0); }
        .btn-success-custom { background: linear-gradient(135deg, var(--success-color), #146c43); }
        .btn-danger-custom { background: linear-gradient(135deg, var(--danger-color), #b02a37); }

        .form-control-custom {
            border-radius: 25px;
            border: 2px solid #e9ecef;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-connected { background-color: var(--success-color); }
        .status-disconnected { background-color: var(--danger-color); }
        .status-connecting { background-color: var(--warning-color); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            padding: 40px 20px;
            font-style: italic;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success-color);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .copy-notification.show {
            transform: translateX(0);
        }

        .maximize-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: inherit;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .maximize-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .connection-status {
            display: flex;
            align-items: center;
            font-weight: 600;
            margin-left: 15px;
        }

        .json-key { color: #d73a49; font-weight: bold; }
        .json-string { color: #032f62; }
        .json-number { color: #005cc5; }
        .json-boolean { color: #e36209; }
        .json-null { color: #6f42c1; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 头部标题 -->
        <div class="header-section text-center">
            <h1 class="mb-3">
                <i class="bi bi-activity me-3"></i>
                实时日志监控系统
            </h1>
            <p class="mb-0">实时监控各类业务数据流，支持多窗口并行显示</p>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <!-- 第一行：MAC地址、环境选择、连接按钮、状态 -->
            <div class="row align-items-center mb-3">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-router"></i>
                        </span>
                        <input type="text" class="form-control form-control-custom" id="macInput" placeholder="请输入MAC地址">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="environment" id="prodEnv" value="prod" checked>
                        <label class="form-check-label" for="prodEnv">正式环境</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="environment" id="testEnv" value="test">
                        <label class="form-check-label" for="testEnv">测试环境</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-success btn-custom" id="connectBtn">
                        <i class="bi bi-wifi me-2"></i>连接MQTT
                    </button>
                </div>
                <div class="col-md-2">
                    <div class="connection-status">
                        <span class="status-indicator status-disconnected" id="statusIndicator"></span>
                        <span id="statusText">未连接</span>
                    </div>
                </div>
            </div>

            <!-- 第二行：线路名称输入和获取公交可占道信息按钮 -->
            <div class="row align-items-center mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-signpost"></i>
                        </span>
                        <input type="text" class="form-control form-control-custom" id="routeNameInput" placeholder="请输入线路名称">
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-warning btn-custom" id="getLaneInfoBtn">
                        <i class="bi bi-car-front me-2"></i>获取公交可占道信息
                    </button>
                </div>
            </div>

            <!-- 第三行：任务ID输入、推送任务ID输入、回调文件解密失败按钮 -->
            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-hash"></i>
                        </span>
                        <input type="text" class="form-control form-control-custom" id="taskIdInput" placeholder="任务ID">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-send"></i>
                        </span>
                        <input type="text" class="form-control form-control-custom" id="pushTaskIdInput" placeholder="推送任务ID">
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-danger btn-custom" id="decryptFailBtn">
                        <i class="bi bi-shield-exclamation me-2"></i>回调文件解密失败
                    </button>
                </div>
            </div>
        </div>

        <!-- 日志窗口区域 -->
        <div class="log-windows-container" id="logWindowsContainer">
            <!-- 窗口将通过JavaScript动态生成 -->
        </div>

        <!-- 按钮控制区域 -->
        <div class="control-panel">
            <h5 class="mb-4 text-center">
                <i class="bi bi-gear me-2"></i>系统控制面板
            </h5>
            <div class="button-group">
                <button class="btn btn-warning btn-custom" id="pauseBtn">
                    <i class="bi bi-pause-circle me-2"></i>暂停接收
                </button>
                <button class="btn btn-success btn-custom" id="resumeBtn">
                    <i class="bi bi-play-circle me-2"></i>恢复接收
                </button>
                <button class="btn btn-danger btn-custom" id="clearAllBtn">
                    <i class="bi bi-trash me-2"></i>清除全部日志
                </button>
                <button class="btn btn-info btn-custom" id="updateDeviceCacheBtn">
                    <i class="bi bi-arrow-clockwise me-2"></i>更新设备缓存数据
                </button>
                <button class="btn btn-info btn-custom" id="updateRouteCacheBtn">
                    <i class="bi bi-arrow-clockwise me-2"></i>更新线路缓存数据
                </button>
                <button class="btn btn-primary btn-custom" id="pushStaticRouteBtn">
                    <i class="bi bi-send me-2"></i>推送全部静态线路数据
                </button>
                <button class="btn btn-primary btn-custom" id="resendProgramBtn">
                    <i class="bi bi-arrow-repeat me-2"></i>重新推送节目清单
                </button>
                <button class="btn btn-success btn-custom" id="getStaticRouteBtn">
                    <i class="bi bi-download me-2"></i>获取当前设备静态线路数据
                </button>
                <button class="btn btn-info btn-custom" id="getFlightDataBtn">
                    <i class="bi bi-airplane me-2"></i>获取天府机场航班数据
                </button>
                <button class="btn btn-danger btn-custom" id="closeAllMqttBtn">
                    <i class="bi bi-x-circle me-2"></i>关闭所有MQTT连接
                </button>
                <button class="btn btn-secondary btn-custom" id="clearWillMsgBtn">
                    <i class="bi bi-envelope-x me-2"></i>清除遗嘱消息
                </button>
            </div>
        </div>
    </div>

    <!-- 复制通知 -->
    <div class="copy-notification" id="copyNotification">
        <i class="bi bi-check-circle me-2"></i>JSON数据已复制到剪贴板
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 数据类型映射
        const dataTypeMap = [
            {type: 1, name: '新报文计划发班数据', topic: 'bocc', color: 'primary'},
            {type: 2, name: '静态线路数据', topic: 'bocc', color: 'warning'},
            {type: 3, name: '动态车辆数据', topic: 'bocc', color: 'info'},
            {type: 4, name: '天府机场航班数据', topic: '', color: 'success'},
            {type: 5, name: '应急发布', topic: 'emergency', color: 'danger'},
            {type: 6, name: 'APP升级', topic: 'device_app_upgrade', color: 'primary'},
            {type: 7, name: '业务指令', topic: 'action', color: 'warning'},
            {type: 8, name: '指令', topic: 'action', color: 'info'},
            {type: 9, name: '节目撤回', topic: 'message', color: 'success'},
            {type: 10, name: '应急撤回', topic: 'emergency', color: 'danger'},
            {type: 11, name: '老报文计划发班', topic: 'bocc', color: 'primary'},
            {type: 12, name: '节目清单', topic: 'message', color: 'warning'},
            {type: 13, name: '头尾腰牌消息', topic: 'label', color: 'info'},
            {type: 14, name: '头尾腰牌回调', topic: 'label', color: 'success'},
            {type: 15, name: '公交车可占道信息', topic: '', color: 'danger'},
            {type: 99, name: '平台确认信息', topic: 'success', color: 'primary'},
        ];

        // 全局变量
        let eventSource = null;
        let isConnected = false;
        let isPaused = false;
        let logData = {};

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initializeLogWindows();
            setupEventListeners();
        });

        // 初始化日志窗口
        function initializeLogWindows() {
            const container = document.getElementById('logWindowsContainer');
            container.innerHTML = '';

            dataTypeMap.forEach(item => {
                const windowElement = createLogWindow(item);
                container.appendChild(windowElement);
                logData[item.type] = [];
            });
        }

        // 创建日志窗口
        function createLogWindow(item) {
            const windowDiv = document.createElement('div');
            windowDiv.className = 'log-window';
            windowDiv.id = `window-${item.type}`;

            windowDiv.innerHTML = `
                <div class="window-header ${item.color}" onclick="toggleMaximize(${item.type})">
                    <span>${item.name}</span>
                    <button class="maximize-btn" onclick="event.stopPropagation(); toggleMaximize(${item.type})">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                </div>
                <div class="window-content" id="content-${item.type}">
                    <div class="empty-state">
                        <i class="bi bi-inbox" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <div>等待数据接收...</div>
                    </div>
                </div>
            `;

            return windowDiv;
        }

        // 切换窗口最大化
        function toggleMaximize(type) {
            const windowElement = document.getElementById(`window-${type}`);
            windowElement.classList.toggle('maximized');
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 连接按钮
            document.getElementById('connectBtn').addEventListener('click', toggleConnection);
            
            // 控制按钮
            document.getElementById('pauseBtn').addEventListener('click', pauseReceiving);
            document.getElementById('resumeBtn').addEventListener('click', resumeReceiving);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllLogs);
            
            // 其他功能按钮
            document.getElementById('updateDeviceCacheBtn').addEventListener('click', () => sendCommand('updateDeviceCache'));
            document.getElementById('updateRouteCacheBtn').addEventListener('click', () => sendCommand('updateRouteCache'));
            document.getElementById('pushStaticRouteBtn').addEventListener('click', () => sendCommand('pushStaticRoute'));
            document.getElementById('resendProgramBtn').addEventListener('click', () => sendCommand('resendProgram'));
            document.getElementById('getStaticRouteBtn').addEventListener('click', () => sendCommand('getStaticRoute'));
            document.getElementById('getFlightDataBtn').addEventListener('click', () => sendCommand('getFlightData'));
            document.getElementById('getLaneInfoBtn').addEventListener('click', () => getLaneInfo());
            document.getElementById('decryptFailBtn').addEventListener('click', () => decryptFail());
            document.getElementById('closeAllMqttBtn').addEventListener('click', () => sendCommand('closeAllMqtt'));
            document.getElementById('clearWillMsgBtn').addEventListener('click', () => sendCommand('clearWillMsg'));
        }

        // 切换连接状态
        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        // 连接SSE
        function connect() {
            const macAddress = document.getElementById('macInput').value.trim();
            const environment = document.querySelector('input[name="environment"]:checked').value;
            
            if (!macAddress) {
                alert('请输入MAC地址');
                return;
            }

            const baseUrl = environment === 'prod' ? 'http://10.30.148.105:8080' : 'http://10.30.148.105:8080';
            const url = `${baseUrl}/api/logs/stream?mac=${macAddress}`;

            eventSource = new EventSource(url);
            
            updateConnectionStatus('connecting');

            eventSource.onopen = function() {
                isConnected = true;
                updateConnectionStatus('connected');
                updateConnectButton();
            };

            eventSource.onmessage = function(event) {
                if (isPaused) return;
                
                try {
                    const data = JSON.parse(event.data);
                    addLogEntry(data);
                } catch (error) {
                    console.error('解析日志数据失败:', error);
                }
            };

            eventSource.onerror = function() {
                isConnected = false;
                updateConnectionStatus('disconnected');
                updateConnectButton();
                console.error('SSE连接错误');
            };
        }

        // 断开连接
        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            isConnected = false;
            updateConnectionStatus('disconnected');
            updateConnectButton();
        }

        // 更新连接状态
        function updateConnectionStatus(status) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            
            indicator.className = 'status-indicator';
            
            switch (status) {
                case 'connecting':
                    indicator.classList.add('status-connecting');
                    text.textContent = '连接中...';
                    break;
                case 'connected':
                    indicator.classList.add('status-connected');
                    text.textContent = '已连接';
                    break;
                case 'disconnected':
                    indicator.classList.add('status-disconnected');
                    text.textContent = '未连接';
                    break;
            }
        }

        // 更新连接按钮
        function updateConnectButton() {
            const btn = document.getElementById('connectBtn');
            if (isConnected) {
                btn.innerHTML = '<i class="bi bi-wifi-off me-2"></i>断开连接';
                btn.className = 'btn btn-danger btn-custom';
            } else {
                btn.innerHTML = '<i class="bi bi-wifi me-2"></i>连接MQTT';
                btn.className = 'btn btn-success btn-custom';
            }
        }

        // 添加日志条目
        function addLogEntry(data) {
            const dataType = data.dataType || data.type;
            if (!dataType || !logData[dataType]) return;

            const timestamp = new Date().toLocaleString();
            const logEntry = {
                timestamp,
                data: data,
                id: Date.now() + Math.random()
            };

            logData[dataType].push(logEntry);
            
            // 限制每个窗口最多显示100条日志
            if (logData[dataType].length > 100) {
                logData[dataType].shift();
            }

            updateLogWindow(dataType);
        }

        // 更新日志窗口
        function updateLogWindow(dataType) {
            const contentDiv = document.getElementById(`content-${dataType}`);
            const logs = logData[dataType];
            
            if (logs.length === 0) {
                contentDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <div>等待数据接收...</div>
                    </div>
                `;
                return;
            }

            contentDiv.innerHTML = logs.map(log => `
                <div class="log-entry" onclick="copyToClipboard('${log.id}')">
                    <div class="log-timestamp">${log.timestamp}</div>
                    <div class="json-content">${formatJSON(log.data)}</div>
                </div>
            `).join('');

            // 滚动到底部
            contentDiv.scrollTop = contentDiv.scrollHeight;
        }

        // 格式化JSON
        function formatJSON(obj) {
            const jsonString = JSON.stringify(obj, null, 2);
            return jsonString
                .replace(/"(.*?)":/g, '<span class="json-key">"$1":</span>')
                .replace(/: "(.*?)"/g, ': <span class="json-string">"$1"</span>')
                .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
                .replace(/: (null)/g, ': <span class="json-null">$1</span>')
                .replace(/: (\d+)/g, ': <span class="json-number">$1</span>');
        }

        // 复制到剪贴板
        function copyToClipboard(logId) {
            const dataType = Object.keys(logData).find(type => 
                logData[type].some(log => log.id == logId)
            );
            const log = logData[dataType].find(log => log.id == logId);
            
            if (log) {
                navigator.clipboard.writeText(JSON.stringify(log.data, null, 2)).then(() => {
                    showCopyNotification();
                });
            }
        }

        // 显示复制通知
        function showCopyNotification() {
            const notification = document.getElementById('copyNotification');
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // 暂停接收
        function pauseReceiving() {
            isPaused = true;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resumeBtn').disabled = false;
        }

        // 恢复接收
        function resumeReceiving() {
            isPaused = false;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('resumeBtn').disabled = true;
        }

        // 清除所有日志
        function clearAllLogs() {
            Object.keys(logData).forEach(dataType => {
                logData[dataType] = [];
                updateLogWindow(dataType);
            });
        }

        // 发送命令
        function sendCommand(command) {
            const macAddress = document.getElementById('macInput').value.trim();
            const environment = document.querySelector('input[name="environment"]:checked').value;
            
            if (!macAddress) {
                alert('请输入MAC地址');
                return;
            }

            const baseUrl = environment === 'prod' ? 'http://10.30.148.105:8080' : 'http://10.30.148.105:8080';
            const url = `${baseUrl}/api/command/${command}`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ mac: macAddress })
            })
            .then(response => response.json())
            .then(data => {
                console.log('命令执行结果:', data);
                alert(`命令 ${command} 执行成功`);
            })
            .catch(error => {
                console.error('命令执行失败:', error);
                alert(`命令 ${command} 执行失败: ${error.message}`);
            });
        }

        // 获取公交可占道信息
        function getLaneInfo() {
            const routeName = document.getElementById('routeNameInput').value.trim();
            const macAddress = document.getElementById('macInput').value.trim();
            const environment = document.querySelector('input[name="environment"]:checked').value;
            
            if (!routeName) {
                alert('请输入线路名称');
                return;
            }
            
            if (!macAddress) {
                alert('请输入MAC地址');
                return;
            }

            const baseUrl = environment === 'prod' ? 'http://10.30.148.105:8080' : 'http://10.30.148.105:8080';
            const url = `${baseUrl}/api/lane-info`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    mac: macAddress,
                    routeName: routeName
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('获取公交可占道信息结果:', data);
                alert(`获取线路 ${routeName} 的占道信息成功`);
            })
            .catch(error => {
                console.error('获取公交可占道信息失败:', error);
                alert(`获取公交可占道信息失败: ${error.message}`);
            });
        }

        // 回调文件解密失败
        function decryptFail() {
            const taskId = document.getElementById('taskIdInput').value.trim();
            const pushTaskId = document.getElementById('pushTaskIdInput').value.trim();
            const macAddress = document.getElementById('macInput').value.trim();
            const environment = document.querySelector('input[name="environment"]:checked').value;
            
            if (!taskId || !pushTaskId) {
                alert('请输入任务ID和推送任务ID');
                return;
            }
            
            if (!macAddress) {
                alert('请输入MAC地址');
                return;
            }

            const baseUrl = environment === 'prod' ? 'http://10.30.148.105:8080' : 'http://10.30.148.105:8080';
            const url = `${baseUrl}/api/decrypt-fail`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    mac: macAddress,
                    taskId: taskId,
                    pushTaskId: pushTaskId
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('回调文件解密失败处理结果:', data);
                alert(`任务ID ${taskId} 解密失败处理完成`);
            })
            .catch(error => {
                console.error('回调文件解密失败处理失败:', error);
                alert(`回调文件解密失败处理失败: ${error.message}`);
            });
        }

        // 页面卸载时断开连接
        window.addEventListener('beforeunload', function() {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
