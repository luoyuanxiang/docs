<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时日志监控平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container-fluid {
            padding: 20px;
            max-width: 2000px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-panel {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }

        .control-panel input {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 8px;
            flex: 0 1 300px;
        }

        .control-panel input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--bg-dark);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin: 0;
        }

        .radio-group input[type="radio"] {
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-success-custom {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-warning-custom {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-danger-custom {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-info-custom {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
        }

        .btn-secondary-custom {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            color: white;
        }

        .logs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .log-window {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 500px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .log-window.maximized {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
            height: auto;
        }

        .log-window-header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-dark);
            border-radius: 12px 12px 0 0;
        }

        .log-window-title {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-custom {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-primary { background: #3b82f6; }
        .badge-warning { background: #f59e0b; }
        .badge-info { background: #06b6d4; }
        .badge-success { background: #10b981; }
        .badge-danger { background: #ef4444; }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-controls button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .window-controls button:hover {
            color: var(--text-primary);
            background: var(--border-color);
        }

        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .log-content::-webkit-scrollbar {
            width: 8px;
        }

        .log-content::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .log-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .log-content::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .log-entry {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #3b82f6;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .log-entry:hover {
            background: #1e3a5f;
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
        }

        .log-entry.copied::after {
            content: '已复制!';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            animation: fadeOut 1.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        .log-timestamp {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .json-key {
            color: #a78bfa;
        }

        .json-string {
            color: #34d399;
        }

        .json-number {
            color: #60a5fa;
        }

        .json-boolean {
            color: #fb923c;
        }

        .json-null {
            color: #f87171;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-disconnected {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .status-paused {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }

        .log-count {
            background: var(--bg-dark);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }

        @media (max-width: 1400px) {
            .logs-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .logs-grid {
                grid-template-columns: 1fr;
            }

            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .control-panel input {
                flex: 1;
            }
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-secondary);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header">
            <h1>
                <i class="bi bi-broadcast"></i>
                实时日志监控平台
                <span class="status-indicator" id="statusIndicator"></span>
            </h1>

            <div class="control-panel">
                <input type="text" id="macInput" placeholder="请输入MAC码" value="">
                
                <div class="radio-group">
                    <label>
                        <input type="radio" name="environment" value="production" checked>
                        正式环境
                    </label>
                    <label>
                        <input type="radio" name="environment" value="test">
                        测试环境
                    </label>
                </div>

                <button class="btn-custom btn-primary-custom" onclick="connectMQTT()">
                    <i class="bi bi-plug"></i>
                    连接MQTT
                </button>
            </div>

            <div class="button-group">
                <button class="btn-custom btn-warning-custom" onclick="pauseReceiving()">
                    <i class="bi bi-pause-fill"></i>
                    暂停接收
                </button>
                <button class="btn-custom btn-success-custom" onclick="resumeReceiving()">
                    <i class="bi bi-play-fill"></i>
                    恢复接收
                </button>
                <button class="btn-custom btn-danger-custom" onclick="clearAllLogs()">
                    <i class="bi bi-trash"></i>
                    清除全部日志
                </button>
                <button class="btn-custom btn-info-custom" onclick="updateDeviceCache()">
                    <i class="bi bi-arrow-repeat"></i>
                    更新设备缓存数据
                </button>
                <button class="btn-custom btn-info-custom" onclick="updateRouteCache()">
                    <i class="bi bi-arrow-repeat"></i>
                    更新线路缓存数据
                </button>
                <button class="btn-custom btn-primary-custom" onclick="pushAllStaticRoutes()">
                    <i class="bi bi-send"></i>
                    推送全部静态线路数据
                </button>
                <button class="btn-custom btn-primary-custom" onclick="repushProgramList()">
                    <i class="bi bi-send"></i>
                    重新推送节目清单
                </button>
                <button class="btn-custom btn-secondary-custom" onclick="getCurrentDeviceStaticRoute()">
                    <i class="bi bi-download"></i>
                    获取当前设备静态线路数据
                </button>
                <button class="btn-custom btn-secondary-custom" onclick="getTianfuAirportFlights()">
                    <i class="bi bi-airplane"></i>
                    获取天府机场航班数据
                </button>
                <button class="btn-custom btn-secondary-custom" onclick="getBusLaneInfo()">
                    <i class="bi bi-sign-stop"></i>
                    获取公交车道占道信息
                </button>
                <button class="btn-custom btn-danger-custom" onclick="closeAllMQTT()">
                    <i class="bi bi-x-circle"></i>
                    关闭所有MQTT连接
                </button>
                <button class="btn-custom btn-warning-custom" onclick="clearWillMessage()">
                    <i class="bi bi-eraser"></i>
                    清除遗嘱消息
                </button>
            </div>
        </div>

        <div class="logs-grid" id="logsGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dataTypeMap = [
            {type: 1, name: '新报文计划发班数据', topic: 'bocc', color: 'primary'},
            {type: 2, name: '静态线路数据', topic: 'bocc', color: 'warning'},
            {type: 3, name: '动态车辆数据', topic: 'bocc', color: 'info'},
            {type: 4, name: '天府机场航班数据', topic: '', color: 'success'},
            {type: 5, name: '应急发布', topic: 'emergency', color: 'danger'},
            {type: 6, name: 'APP升级', topic: 'device_app_upgrade', color: 'primary'},
            {type: 7, name: '业务指令', topic: 'action', color: 'warning'},
            {type: 8, name: '指令', topic: 'action', color: 'info'},
            {type: 9, name: '节目撤回', topic: 'message', color: 'success'},
            {type: 10, name: '应急撤回', topic: 'emergency', color: 'danger'},
            {type: 11, name: '老报文计划发班', topic: 'bocc', color: 'primary'},
            {type: 12, name: '节目清单', topic: 'message', color: 'warning'}
        ];

        let eventSource = null;
        let isPaused = false;
        let logs = {};
        let maximizedWindow = null;

        // 初始化窗口
        function initializeWindows() {
            const grid = document.getElementById('logsGrid');
            grid.innerHTML = '';

            dataTypeMap.forEach(type => {
                logs[type.type] = [];
                
                const window = document.createElement('div');
                window.className = 'log-window';
                window.id = `window-${type.type}`;
                
                window.innerHTML = `
                    <div class="log-window-header">
                        <div class="log-window-title">
                            <span class="badge-custom badge-${type.color}">${type.name}</span>
                            <span class="log-count" id="count-${type.type}">0</span>
                        </div>
                        <div class="window-controls">
                            <button onclick="clearWindowLogs(${type.type})" title="清除">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button onclick="toggleMaximize(${type.type})" title="最大化">
                                <i class="bi bi-arrows-fullscreen" id="maximize-icon-${type.type}"></i>
                            </button>
                        </div>
                    </div>
                    <div class="log-content" id="log-${type.type}">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>等待日志数据...</p>
                        </div>
                    </div>
                `;
                
                grid.appendChild(window);
            });
        }

        // 切换窗口最大化
        function toggleMaximize(type) {
            const window = document.getElementById(`window-${type}`);
            const icon = document.getElementById(`maximize-icon-${type}`);
            
            if (maximizedWindow === type) {
                window.classList.remove('maximized');
                icon.className = 'bi bi-arrows-fullscreen';
                maximizedWindow = null;
            } else {
                if (maximizedWindow !== null) {
                    const prevWindow = document.getElementById(`window-${maximizedWindow}`);
                    const prevIcon = document.getElementById(`maximize-icon-${maximizedWindow}`);
                    prevWindow.classList.remove('maximized');
                    prevIcon.className = 'bi bi-arrows-fullscreen';
                }
                window.classList.add('maximized');
                icon.className = 'bi bi-fullscreen-exit';
                maximizedWindow = type;
            }
        }

        // 格式化JSON
        function formatJSON(obj) {
            const json = JSON.stringify(obj, null, 2);
            return json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
                .replace(/: (\d+)/g, ': <span class="json-number">$1</span>')
                .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
                .replace(/: null/g, ': <span class="json-null">null</span>');
        }

        // 添加日志
        function addLog(dataType, data) {
            if (isPaused) return;

            const logContent = document.getElementById(`log-${dataType}`);
            if (!logContent) return;

            // 移除空状态
            const emptyState = logContent.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            logs[dataType] = logs[dataType] || [];
            logs[dataType].push(data);

            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const timestamp = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                fractionalSecondDigits: 3
            });

            logEntry.innerHTML = `
                <div class="log-timestamp">${timestamp}</div>
                <pre style="margin: 0; white-space: pre-wrap; word-break: break-all;">${formatJSON(data)}</pre>
            `;

            logEntry.onclick = function() {
                copyToClipboard(JSON.stringify(data, null, 2), logEntry);
            };

            logContent.insertBefore(logEntry, logContent.firstChild);

            // 限制日志数量
            const maxLogs = 100;
            while (logContent.children.length > maxLogs) {
                logContent.removeChild(logContent.lastChild);
            }

            // 更新计数
            updateLogCount(dataType);
        }

        // 更新日志计数
        function updateLogCount(type) {
            const count = logs[type] ? logs[type].length : 0;
            const countElement = document.getElementById(`count-${type}`);
            if (countElement) {
                countElement.textContent = count;
            }
        }

        // 复制到剪贴板
        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            });
        }

        // 清除单个窗口日志
        function clearWindowLogs(type) {
            const logContent = document.getElementById(`log-${type}`);
            if (logContent) {
                logContent.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>等待日志数据...</p>
                    </div>
                `;
                logs[type] = [];
                updateLogCount(type);
            }
        }

        // 清除所有日志
        function clearAllLogs() {
            dataTypeMap.forEach(type => {
                clearWindowLogs(type.type);
            });
        }

        // 更新状态指示器
        function updateStatusIndicator(status) {
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator';
            if (status === 'connected') {
                indicator.classList.add('status-connected');
            } else if (status === 'paused') {
                indicator.classList.add('status-paused');
            } else {
                indicator.classList.add('status-disconnected');
            }
        }

        // 连接SSE
        function connectSSE() {
            const mac = document.getElementById('macInput').value;
            const env = document.querySelector('input[name="environment"]:checked').value;
            
            if (eventSource) {
                eventSource.close();
            }

            // 这里需要替换成实际的SSE端点
            const sseUrl = `/api/logs?mac=${mac}&env=${env}`;
            
            eventSource = new EventSource(sseUrl);

            eventSource.onopen = () => {
                updateStatusIndicator('connected');
                console.log('SSE连接已建立');
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.dataType) {
                        addLog(data.dataType, data);
                    }
                } catch (err) {
                    console.error('解析SSE数据失败:', err);
                }
            };

            eventSource.onerror = (error) => {
                console.error('SSE错误:', error);
                updateStatusIndicator('disconnected');
                eventSource.close();
            };
        }

        // 连接MQTT
        function connectMQTT() {
            const mac = document.getElementById('macInput').value;
            if (!mac) {
                alert('请输入MAC码');
                return;
            }
            connectSSE();
        }

        // 暂停接收
        function pauseReceiving() {
            isPaused = true;
            updateStatusIndicator('paused');
        }

        // 恢复接收
        function resumeReceiving() {
            isPaused = false;
            if (eventSource && eventSource.readyState === EventSource.OPEN) {
                updateStatusIndicator('connected');
            } else {
                updateStatusIndicator('disconnected');
            }
        }

        // 关闭所有MQTT连接
        function closeAllMQTT() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            updateStatusIndicator('disconnected');
        }

        // API调用函数
        async function apiCall(endpoint, data = {}) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                console.log('API调用成功:', result);
                return result;
            } catch (error) {
                console.error('API调用失败:', error);
                alert('操作失败: ' + error.message);
            }
        }

        function updateDeviceCache() {
            apiCall('/api/update-device-cache');
        }

        function updateRouteCache() {
            apiCall('/api/update-route-cache');
        }

        function pushAllStaticRoutes() {
            const mac = document.getElementById('macInput').value;
            apiCall('/api/push-static-routes', { mac });
        }

        function repushProgramList() {
            const mac = document.getElementById('macInput').value;
            apiCall('/api/repush-program-list', { mac });
        }

        function getCurrentDeviceStaticRoute() {
            const mac = document.getElementById('macInput').value;
            apiCall('/api/get-device-static-route', { mac });
        }

        function getTianfuAirportFlights() {
            apiCall('/api/get-tianfu-flights');
        }

        function getBusLaneInfo() {
            apiCall('/api/get-bus-lane-info');
        }

        function clearWillMessage() {
            apiCall('/api/clear-will-message');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initializeWindows();
            updateStatusIndicator('disconnected');

            // 模拟数据 - 用于测试，实际使用时请删除
            // setTimeout(() => {
            //     addLog(1, {dataType: 1, message: '测试数据', timestamp: Date.now(), details: {line: '123', station: '春熙路'}});
            //     addLog(2, {dataType: 2, message: '静态线路更新', route: 'G01', status: 'active'});
            // }, 2000);
        });
    </script>
</body>
</html>
